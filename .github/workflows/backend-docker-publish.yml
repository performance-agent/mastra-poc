name: Build and publish backend Docker image

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "backend/**"
      - "core/**"
      - ".github/workflows/backend-docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  queue: max
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend

jobs:
  build:
    name: Build NestJS backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            core/package-lock.json
            backend/package-lock.json

      - name: Install core dependencies
        working-directory: core
        run: npm ci

      - name: Build core packages
        working-directory: core
        run: npm run build

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Build agent package
        working-directory: agent
        run: npm run build

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  docker:
    name: Build and publish backend Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger deployment
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_CLIENT_ID: ${{ secrets.DEPLOY_CLIENT_ID }}
          DEPLOY_CLIENT_SECRET: ${{ secrets.DEPLOY_CLIENT_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || \
             [ -z "$DEPLOY_CLIENT_ID" ] || \
             [ -z "$DEPLOY_CLIENT_SECRET" ]; then
            echo "::error::Missing deployment configuration"
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 60 \
            --request GET \
            --header "CF-Access-Client-Id: $DEPLOY_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $DEPLOY_CLIENT_SECRET" \
            "$DEPLOY_URL"

          echo "Deployment triggered successfully."
