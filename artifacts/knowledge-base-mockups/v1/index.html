<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge base · Platformance mockups</title>
    <link rel="stylesheet" href="mockup.css" />
    <script src="mockup.js" defer></script>
  </head>
  <body>
    <div class="review-bar">
      <div class="review-inner">
        <span class="review-label">DESIGN PREVIEW <b>v1</b></span
        ><label class="review-picker"
          >Screen
          <select
            id="screen-picker"
            aria-label="Preview screen"
          ></select></label
        ><a href="gallery.html"
          >All screens <span aria-hidden="true">↗</span></a
        >
      </div>
    </div>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#workspace" aria-label="Platformance home"
          ><img
            src="../../../frontend/src/assets/brand/isotipo.svg"
            alt="" /><img
            src="../../../frontend/src/assets/brand/logotipo.svg"
            alt="Platformance"
        /></a>
        <div class="account">
          <span class="desktop-icons" id="top-icons"></span
          ><span class="avatar small">AR</span
          ><span class="account-name"
            >Alex Rivera<small>alex@example.test</small></span
          >
        </div>
      </div>
    </header>
    <main id="app"></main>
    <div id="overlay-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <footer class="demo-footer">
      INTERACTIVE MOCKUP · FICTIONAL DATA · Uploads, Drive connections and
      report generation are simulated
    </footer>
  </body>
</html>
